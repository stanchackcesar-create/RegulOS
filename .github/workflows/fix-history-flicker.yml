name: Corrigir atualização piscando do histórico

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-history-flicker]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correção sem piscar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')
          old="""async function loadLinkHistory(){
 const box=document.getElementById('linkHistory');
 if(!box)return;
 try{
  box.innerHTML='<div class=\"muted\">🔄 Carregando histórico...</div>';
  const d=await jfetch('/api/link-historico'); box.innerHTML='';
  if(!d.historico.length){box.innerHTML='<div class=\"muted\">Nenhum link enviado e arquivado ainda.</div>';return}"""
          new="""let lastHistorySignature='';
async function loadLinkHistory(){
 const box=document.getElementById('linkHistory');
 if(!box)return;
 try{
  const d=await jfetch('/api/link-historico');
  const signature=JSON.stringify(d.historico||[]);
  if(signature===lastHistorySignature)return;
  lastHistorySignature=signature;
  box.innerHTML='';
  if(!d.historico.length){box.innerHTML='<div class=\"muted\">Nenhum link enviado e arquivado ainda.</div>';return}"""
          if old not in s:
              raise SystemExit('Trecho de loadLinkHistory não encontrado; nenhuma alteração feita.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          node --check src/server.js
          grep -n "lastHistorySignature" public/index.html
      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir atualização piscando do histórico [skip-history-flicker]"
          git push