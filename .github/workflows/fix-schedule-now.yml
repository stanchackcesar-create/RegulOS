name: Corrigir agendamento agora

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/server.js')
          s=p.read_text(encoding='utf-8')
          old="""    if (!targets.length) {
      item.status = 'pausado';
      item.lastSkipKey = dateKey(now);
      writeJson(FILES.schedules, linkSchedules);
      addLog(`Agendamento \"${item.nome}\" aguardando: nenhum grupo Ligado.`);
      return;
    }"""
          new="""    if (!targets.length) {
      item.status = 'agendado';
      item.lastSkipKey = dateKey(now);
      writeJson(FILES.schedules, linkSchedules);
      addLog(`Agendamento \"${item.nome}\" aguardando: nenhum grupo Ligado. Tentará novamente.`);
      return;
    }"""
          if old not in s: raise SystemExit('bloco targets não encontrado')
          s=s.replace(old,new,1)
          old="""    const allDone = (item.progressTargets || []).every(id => (item.progressGroupIds || []).includes(id) || getGroupConfig(id).ativo === false);"""
          new="""    const allDone = (item.progressTargets || []).every(id => (item.progressGroupIds || []).includes(id));"""
          if old not in s: raise SystemExit('bloco allDone não encontrado')
          s=s.replace(old,new,1)
          old="""    } else {
      item.status = botWindowActive() ? 'enviando' : 'pausado';
      writeJson(FILES.schedules, linkSchedules);
      addLog(`Link \"${item.nome}\": progresso preservado; continuará de onde parou.`);
    }"""
          new="""    } else {
      item.status = botWindowActive() ? 'agendado' : 'pausado';
      writeJson(FILES.schedules, linkSchedules);
      addLog(`Link \"${item.nome}\": progresso preservado; continuará de onde parou.`);
    }"""
          if old not in s: raise SystemExit('bloco progresso não encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validar
        run: node --check src/server.js
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrigir pausa indevida de agendamentos [skip ci]"
          git push
