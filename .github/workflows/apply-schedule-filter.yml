name: Aplicar rolagem e filtro de Agendamentos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar filtro e rolagem
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'REGULOS_SCHEDULE_FILTER_V1'

          if marker in text:
              print('Correção de rolagem/filtro já aplicada.')
              raise SystemExit(0)

          # 1) Rolagem interna do painel, sem alterar o restante da página.
          css_marker = '</style>'
          css = '''
          /* REGULOS_SCHEDULE_FILTER_V1 */
          .schedule-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
          .schedule-tools input{flex:1 1 280px;min-width:180px}
          .schedule-scroll{max-height:520px;overflow-y:auto;overflow-x:hidden;padding-right:6px;overscroll-behavior:contain;scrollbar-width:thin}
          .schedule-scroll .link{margin-right:2px}
          .schedule-filter-result{font-size:13px;color:#9eb0ca;min-height:18px;margin-top:4px}
          @media(max-width:560px){.schedule-scroll{max-height:60vh}.schedule-tools{align-items:stretch}.schedule-tools input{flex-basis:100%}.schedule-tools button{min-height:44px}}
          '''
          if css_marker not in text:
              text = text.replace(css_marker, css + '\n' + css_marker, 1)

          # 2) Campo de pesquisa por nome do link ou horário/data exibidos nos cards.
          schedule_needle = '<div id="schedules" style="margin-top:10px">Carregando agendamentos...</div>'
          schedule_replacement = '''<div class="schedule-tools" id="scheduleTools">
            <input id="scheduleFilter" type="search" placeholder="🔎 Pesquisar nome do link ou horário (ex.: Epson, 03:15)" oninput="filterSchedules()" autocomplete="off">
            <button type="button" onclick="clearScheduleFilter()">Limpar</button>
          </div>
          <div id="scheduleFilterResult" class="schedule-filter-result"></div>
          <div id="schedules" class="schedule-scroll" style="margin-top:10px">Carregando agendamentos...</div>'''
          if schedule_needle not in text:
              raise SystemExit('Bloco de Agendamentos não encontrado.')
          text = text.replace(schedule_needle, schedule_replacement, 1)

          # 3) Funções do filtro ficam fora de loadSchedules para não depender do polling.
          js_marker = '// REGULOS_SCHEDULE_FILTER_JS_V1'
          js = r'''// REGULOS_SCHEDULE_FILTER_JS_V1
          function filterSchedules(){
            const input=document.getElementById('scheduleFilter');
            const box=document.getElementById('schedules');
            const result=document.getElementById('scheduleFilterResult');
            if(!input||!box)return;
            const q=String(input.value||'').trim().toLocaleLowerCase('pt-BR');
            const cards=[...box.querySelectorAll('.link')];
            let visible=0;
            cards.forEach(card=>{
              const hay=String(card.textContent||'').toLocaleLowerCase('pt-BR');
              const show=!q||hay.includes(q);
              card.style.display=show?'':'none';
              if(show)visible++;
            });
            if(!cards.length){
              if(result)result.textContent='';
              return;
            }
            if(result)result.textContent=q?`${visible} agendamento(s) encontrado(s).`:`${cards.length} agendamento(s).`;
          }

          function clearScheduleFilter(){
            const input=document.getElementById('scheduleFilter');
            if(input)input.value='';
            filterSchedules();
            if(input)input.focus();
          }

          (function installScheduleFilterObserver(){
            const start=()=>{
              const box=document.getElementById('schedules');
              if(!box)return;
              if(box.__regulosScheduleObserver)return;
              const observer=new MutationObserver(()=>filterSchedules());
              observer.observe(box,{childList:true,subtree:true});
              box.__regulosScheduleObserver=observer;
              filterSchedules();
            };
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});
            else start();
          })();
          '''
          # Inject before the first function that follows loadSchedules. This does not replace
          # the existing renderer, so all existing schedule buttons/fields remain intact.
          anchor = 'async function saveBotSchedule(){'
          if anchor not in text:
              raise SystemExit('Ponto de inserção do filtro não encontrado.')
          text = text.replace(anchor, js + '\n' + anchor, 1)

          p.write_text(text, encoding='utf-8')
          print('Filtro e rolagem de Agendamentos aplicados.')
          PY

      - name: Validar HTML/JS embutido
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('public/index.html').read_text(encoding='utf-8')
          required = [
              'REGULOS_SCHEDULE_FILTER_V1',
              'id="scheduleFilter"',
              'class="schedule-scroll"',
              'function filterSchedules()',
              'function clearScheduleFilter()'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('Itens ausentes: ' + ', '.join(missing))
          print('Validação OK.')
          PY

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          git commit -m "Adicionar rolagem e filtro aos agendamentos"
          git push
