name: Fix image fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir fallback de imagem
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/server.js')
          text = path.read_text(encoding='utf-8')
          changed = False

          # Corrige a regex que foi gravada com barras extras e quebrava o Node.
          bad = r'if(!/^https?:\\\\/\\\\//i.test(s)) return;'
          good = r'if(!/^https?:\\/\\//i.test(s)) return;'
          if bad in text:
              text = text.replace(bad, good)
              changed = True
              print('Regex do fallback corrigida.')

          # Também corrige a variante equivalente caso exista mais de uma vez.
          bad2 = r'^https?:\\\\/\\\\//i.test(s)'
          good2 = r'^https?:\\/\\//i.test(s)'
          if bad2 in text:
              text = text.replace(bad2, good2)
              changed = True
              print('Variante da regex do fallback corrigida.')

          path.write_text(text, encoding='utf-8')
          print('Alterações:', changed)

      - name: Verificar sintaxe antes de publicar
        shell: bash
        run: |
          node --check src/server.js
          echo "Sintaxe do server.js OK"

      - name: Commit da correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js .github/workflows/fix-aliexpress-image-fallback.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para gravar."
            exit 0
          fi
          git commit -m "fix: corrigir regex do fallback de imagem"
          git push
