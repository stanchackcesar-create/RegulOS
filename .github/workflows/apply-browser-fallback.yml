name: Aplicar fallback de navegador

on:
  push:
    branches: [fix/fallback-browser-links]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-browser-fallback]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aplicar fallback Playwright
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const file = path.join(process.cwd(), 'src', 'server.js');
          let source = fs.readFileSync(file, 'utf8');

          if (!source.includes("require('playwright')")) {
            const importMarker = "const crypto = require('crypto');";
            if (!source.includes(importMarker)) throw new Error('Marcador de importação não encontrado.');
            source = source.replace(importMarker, importMarker + "\nconst { chromium } = require('playwright');");
          }

          if (!source.includes('async function getRegulosBrowser()')) {
            const marker = "const DEFAULT_RANDOM_MESSAGES = [";
            const idx = source.indexOf(marker);
            if (idx < 0) throw new Error('Marcador DEFAULT_RANDOM_MESSAGES não encontrado.');
            const browserHelpers = [
              'let regulosBrowserPromise = null;',
              'async function getRegulosBrowser() {',
              '  if (!regulosBrowserPromise) {',
              '    regulosBrowserPromise = chromium.launch({ headless: true, args: [\'--no-sandbox\', \'--disable-setuid-sandbox\', \'--disable-dev-shm-usage\'] }).catch(err => {',
              '      regulosBrowserPromise = null;',
              '      throw err;',
              '    });',
              '  }',
              '  return regulosBrowserPromise;',
              '}',
              '',
              'async function findProductImageWithBrowser(url) {',
              '  let context = null;',
              '  try {',
              '    await assertSafeExternalUrl(url);',
              '    const browser = await getRegulosBrowser();',
              '    context = await browser.newContext({ userAgent: \'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36\', locale: \'pt-BR\', viewport: { width: 1365, height: 900 }, javaScriptEnabled: true, ignoreHTTPSErrors: true });',
              '    const page = await context.newPage();',
              '    await page.route(\'**/*\', async route => {',
              '      const target = route.request().url();',
              '      if (/^(data:|blob:|about:|chrome:)/i.test(target)) return route.continue();',
              '      try { await assertSafeExternalUrl(target); return route.continue(); } catch { return route.abort(); }',
              '    });',
              '    await page.goto(url, { waitUntil: \'domcontentloaded\', timeout: 30000 });',
              '    await page.waitForTimeout(1800);',
              '    const candidates = await page.evaluate(() => {',
              '      const out = []; const seen = new Set();',
              '      const add = value => { if (!value || /^data:|^blob:/i.test(value)) return; try { const u = new URL(value, location.href).href; if (/^https?:/i.test(u) && !seen.has(u)) { seen.add(u); out.push(u); } } catch {} };',
              '      document.querySelectorAll(\'meta[property="og:image"],meta[name="twitter:image"],meta[property="og:image:url"]\').forEach(x => add(x.content));',
              '      document.querySelectorAll(\'img\').forEach(img => { add(img.currentSrc || img.src); [\'data-src\',\'data-original\',\'data-lazy-src\',\'data-image\',\'data-image-src\',\'data-zoom-image\',\'data-large_image\'].forEach(a => add(img.getAttribute(a))); const srcset = img.getAttribute(\'srcset\') || img.getAttribute(\'data-srcset\') || \'\'; srcset.split(\',\').forEach(x => add(x.trim().split(/\\s+/)[0])); });',
              '      document.querySelectorAll(\'[style*="background-image"]\').forEach(el => { const m = String(el.getAttribute(\'style\') || \'\').match(/url\\((?:["\']?)([^)"\']+)/i); if (m) add(m[1]); });',
              '      return out.slice(0, 80);',
              '    });',
              '    for (const candidate of candidates) {',
              '      try { const image = await downloadBuffer(candidate, url); await context.close(); addLog(\'Fallback navegador encontrou imagem: \' + candidate); return image; } catch {}',
              '    }',
              '    await context.close();',
              '  } catch (e) {',
              '    try { if (context) await context.close(); } catch {}',
              '    addLog(\'Fallback navegador indisponível: \' + e.message);',
              '  }',
              '  return null;',
              '}',
              '',
              ''
            ].join('\\n');
            source = source.slice(0, idx) + browserHelpers + source.slice(idx);
          }

          const fnStart = source.indexOf('async function findProductImage');
          const fnEnd = source.indexOf('const DEFAULT_RANDOM_MESSAGES = [', fnStart);
          if (fnStart < 0 || fnEnd < 0) throw new Error('Função de busca de imagem não encontrada.');
          let fn = source.slice(fnStart, fnEnd);
          if (!fn.includes('findProductImageWithBrowser(url)')) {
            const lastReturn = fn.lastIndexOf('return null;');
            if (lastReturn < 0) throw new Error('return null da função de imagem não encontrado.');
            fn = fn.slice(0, lastReturn) + '  const browserImage = await findProductImageWithBrowser(url);\\n  if (browserImage) return browserImage;\\n' + fn.slice(lastReturn);
            source = source.slice(0, fnStart) + fn + source.slice(fnEnd);
          }

          fs.writeFileSync(file, source, 'utf8');
          console.log('Fallback Playwright aplicado com sucesso.');
          NODE

      - name: Validar sintaxe
        run: node --check src/server.js

      - name: Gravar alteração automática
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "[auto-browser-fallback] Adicionar fallback de navegador para imagens"
            git push
          fi
