name: Aplicar correção final do envio agendado

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir envio sem bloquear pela imagem
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')

          marker = '// REGULOS_SCHEDULE_IMAGE_FALLBACK_OPTIONAL_V3'
          if marker in s:
              print('Correção já aplicada.')
              raise SystemExit(0)

          start = s.find('    if (!productImage) {')
          end = s.find('    const startedAt = Date.now();', start)

          if start < 0 or end < 0:
              raise SystemExit('Bloco do envio agendado não encontrado; nenhuma alteração foi feita.')

          replacement = '''    if (!productImage) {
      // A imagem é opcional. Se a loja não fornecer uma imagem válida,
      // o agendamento continua e envia o texto/link normalmente.
      // Nenhum preço, desconto ou outro dado é inventado.
      addLog(`Imagem automática não encontrada para "${item.nome}". Enviando somente texto/link.`);
    } else {
      addLog(`Imagem encontrada para "${item.nome}".`);
    }

    // REGULOS_SCHEDULE_IMAGE_FALLBACK_OPTIONAL_V3
'''

          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Correção aplicada.')
          PY

      - name: Validar JavaScript
        run: node --check src/server.js

      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para commitar.'
          else
            git commit -m 'Corrigir envio agendado sem bloquear pela imagem [skip scheduled patch]'
            git push
          fi
