name: Aplicar correção presença e atualizar
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-presence-refresh-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corrigir presença e atualização do painel
        shell: python
        run: |
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          old = """  const tasks=[status,loadGroups,loadLinks,loadSchedules,loadLinkHistory,loadLinkFailures,loadLogs,loadDashboard,refreshAccountPresence];"""
          new = """  const tasks=[status,loadGroups,loadLinks,loadSchedules,loadLinkHistory,loadLinkFailures,loadLogs,loadDashboard,loadAccount,refreshAccountPresence];"""
          if old in s:
              s = s.replace(old, new, 1)
          old = """setInterval(accountHeartbeat,15000);\nsetInterval(()=>{refreshAccountPresence();},5000);\nsetTimeout(()=>{refreshAccountPresence();},1500);"""
          new = """setInterval(accountHeartbeat,5000);\nsetInterval(()=>{refreshAccountPresence();},2000);\nsetInterval(()=>{loadAccount();},7000);\nsetTimeout(()=>{refreshAccountPresence();},1000);"""
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const USER_ONLINE_WINDOW_MS = 45 * 1000;', 'const USER_ONLINE_WINDOW_MS = 12 * 1000;', 1)
          marker = """app.use((req,res,next)=>{\n  res.setHeader('X-Content-Type-Options','nosniff');"""
          replacement = """app.use((req,res,next)=>{\n  if(req.method==='GET' && (req.path==='/' || req.path.endsWith('.html') || req.path.startsWith('/api/'))){\n    res.setHeader('Cache-Control','no-store, no-cache, must-revalidate, proxy-revalidate');\n    res.setHeader('Pragma','no-cache');\n    res.setHeader('Expires','0');\n  }\n  res.setHeader('X-Content-Type-Options','nosniff');"""
          if marker in s and 'Cache-Control' not in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html src/server.js
          git commit -m 'Corrigir presença em tempo real e botão atualizar' || exit 0
          git push origin main
