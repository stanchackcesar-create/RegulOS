name: Garantir imagem obrigatória no reenvio

on:
  push:
    paths:
      - '.github/workflows/enforce-image-resend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir reenvio sem imagem
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/server.js')
          s=p.read_text(encoding='utf-8')
          old="else if(item.imagemAutomatica!==false) image=await findProductImage(String(item.url||'').trim());"
          new="else image=await findProductImage(String(item.url||'').trim());"
          old2="if(item.imagemAutomatica!==false && !image) throw new Error("
          new2="if(!image) throw new Error("
          changed=False
          if old in s:
              s=s.replace(old,new)
              changed=True
          if old2 in s:
              s=s.replace(old2,new2)
              changed=True
          if not changed:
              print('Reenvio já exige imagem ou padrão não encontrado.')
              raise SystemExit(0)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: node --check src/server.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Exigir imagem no reenvio de links" || exit 0
          git push