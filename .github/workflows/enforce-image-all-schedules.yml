name: Enforce imagem obrigatória em agendamentos

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enforce-image-all-schedules.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar regra
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')

          changed = False
          replacements = [
              ('else if (item.imagemAutomatica !== false) {', 'else {'),
              ('else if(item.imagemAutomatica!==false) image=await findProductImage(String(item.url||\'\').trim());', 'else image=await findProductImage(String(item.url||\'\').trim());'),
              ('if(item.imagemAutomatica!==false && !image) throw new Error(', 'if(!image) throw new Error('),
          ]

          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new)
                  changed = True

          marker = "// REGULOS_IMAGE_REQUIRED_ALL_SCHEDULES_V1\n// Todo agendamento de link tenta obter uma imagem válida.\n// Com ou sem montagem automática de oferta, não enviamos link sem imagem.\n"
          if 'REGULOS_IMAGE_REQUIRED_ALL_SCHEDULES_V1' not in s:
              s = marker + s
              changed = True

          if not changed:
              print('Regra já aplicada; nenhuma alteração necessária.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Regra de imagem obrigatória aplicada ao agendamento e ao reenvio.')
          PY

      - name: Validar JavaScript
        run: node --check src/server.js

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git add src/server.js
          git commit -m "Exigir imagem em agendamentos e reenvios"
          git push