name: Corrigir envio agendado sem bloquear por imagem

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip scheduled patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir bloqueio da imagem no envio agendado
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r"    if \(!productImage\) \{.*?"
              r"    addLog\(`Imagem encontrada para \\\"\$\{item\.nome\}\\\"\.\`\);",
              re.S,
          )

          replacement = '''    if (!productImage) {
      // A imagem é opcional: nunca bloquear o envio agendado por falha
      // na obtenção da imagem. Não inventamos preço, desconto ou dados.
      addLog(`Imagem automática não encontrada para "${item.nome}". Enviando somente texto/link.`);
    } else {
      addLog(`Imagem encontrada para "${item.nome}".`);
    }'''

          if 'REGULOS_SCHEDULE_IMAGE_FALLBACK_OPTIONAL_V2' in s:
              print('Correção já aplicada.')
              raise SystemExit(0)

          m = pattern.search(s)
          if not m:
              raise SystemExit('Bloco de imagem do envio agendado não encontrado; nenhuma alteração feita.')

          s = s[:m.start()] + replacement + '\n    // REGULOS_SCHEDULE_IMAGE_FALLBACK_OPTIONAL_V2\n' + s[m.end():]
          p.write_text(s, encoding='utf-8')
          print('Correção aplicada ao envio agendado.')

      - name: Validar JavaScript
        run: node --check src/server.js

      - name: Commitar correção
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.js
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para commitar.'
          else
            git commit -m 'Corrigir envio agendado sem bloquear por imagem [skip scheduled patch]'
            git push
          fi
