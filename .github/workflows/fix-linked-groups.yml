name: Corrigir grupos e Gerenciador de Links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir envio agendado sem bloquear por imagem
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')
          marker = '// REGULOS_SCHEDULE_IMAGE_FALLBACK_OPTIONAL_V3'

          if marker in s:
              print('Correção do envio agendado já aplicada.')
          else:
              start = s.find('    if (!productImage) {')
              end = s.find('    const startedAt = Date.now();', start)
              if start < 0 or end < 0:
                  raise SystemExit('Bloco do envio agendado não encontrado; nenhuma alteração feita.')

              replacement = '''    if (!productImage) {
      // A imagem é opcional. Se não for encontrada/baixada, o envio continua.
      // Nunca inventamos preço, desconto ou qualquer dado da oferta.
      addLog(`Imagem automática não encontrada para "${item.nome}". Enviando somente texto/link.`);
    } else {
      addLog(`Imagem encontrada para "${item.nome}".`);
    }

    // REGULOS_SCHEDULE_IMAGE_FALLBACK_OPTIONAL_V3
'''
              p.write_text(s[:start] + replacement + s[end:], encoding='utf-8')
              print('Correção aplicada ao src/server.js.')

      - name: Aplicar patch do Gerenciador de Links
        run: python tools/patch_schedule.py

      - name: Aplicar patch de imagem do Mercado Livre
        run: python tools/patch_mercadolivre.py

      - name: Aplicar patch de oferta automática
        run: python tools/patch_auto_offer_ui.py

      - name: Validar servidor
        run: node --check src/server.js

      - name: Validar painel
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('public/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', text)
          if not scripts:
              raise SystemExit('Script principal não encontrado.')
          Path('/tmp/regulos.js').write_text(scripts[-1], encoding='utf-8')

      - name: Validar JavaScript
        run: node --check /tmp/regulos.js

      - name: Commitar patch
        run: |
          MSG="$(git log -1 --pretty=%B)"
          if [[ "$MSG" != *"[fix-schedule]"* && "$MSG" != *"[auto-offer]"* ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/server.js
          if git diff --cached --quiet; then
            echo "Patch já aplicado ou nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Corrigir envio agendado sem bloquear por imagem [skip ci]"
          git push origin HEAD:main
