name: Corrigir imagens do Mercado Livre

# V1 - fallback de imagem para links meli.la / Mercado Livre.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Aplicar fallback Mercado Livre
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')

          marker = 'REGULOS_ML_IMAGE_FALLBACK_V1'
          if marker not in s:
              helper = r'''
// REGULOS_ML_IMAGE_FALLBACK_V1
// Mercado Livre: links meli.la podem redirecionar para uma página que não
// entrega a imagem no HTML inicial. Neste caso consultamos o item público
// da API do Mercado Livre e usamos a primeira picture/secure_url disponível.
async function findMercadoLivreImageUrl(url) {
  try {
    const page = await fetchText(url);
    const source = `${page.finalUrl || ''}\n${page.data || ''}`;
    const ids = [];
    const seen = new Set();
    const addId = value => {
      const raw = String(value || '').toUpperCase();
      const m = raw.match(/\b(MLB[-_]?\d{5,})\b/);
      if (!m) return;
      const id = m[1].replace(/[-_]/g, '');
      if (!seen.has(id)) { seen.add(id); ids.push(id); }
    };
    for (const m of source.matchAll(/\bMLB[-_]?\d{5,}\b/gi)) addId(m[0]);

    for (const id of ids.slice(0, 3)) {
      try {
        const api = await fetchText(`https://api.mercadolibre.com/items/${id}`);
        const data = JSON.parse(api.data || '{}');
        const pictures = Array.isArray(data.pictures) ? data.pictures : [];
        for (const picture of pictures) {
          const image = picture?.secure_url || picture?.url;
          if (image && /^https?:\/\//i.test(image)) return image;
        }
        const thumb = data.secure_thumbnail || data.thumbnail;
        if (thumb && /^https?:\/\//i.test(thumb)) return thumb;
      } catch (e) {
        addLog(`Mercado Livre API não retornou imagem para ${id}: ${e.message}`);
      }
    }
  } catch (e) {
    addLog(`Fallback Mercado Livre: ${e.message}`);
  }
  return '';
}
'''
              needle = 'async function findProductImage(url) {'
              if needle not in s:
                  raise SystemExit('Não encontrei findProductImage no src/server.js')
              s = s.replace(needle, helper + '\n' + needle, 1)

              old = needle + '\n  try {\n    const page=await fetchText(url);'
              new = needle + '''
  try {
    const mlImageUrl = await findMercadoLivreImageUrl(url);
    if (mlImageUrl) {
      try {
        const image = await downloadBuffer(mlImageUrl, url);
        addLog(`🖼️ Imagem do Mercado Livre encontrada via API: ${mlImageUrl}`);
        return image;
      } catch (e) {
        addLog(`Imagem do Mercado Livre encontrada, mas não pôde ser baixada: ${e.message}`);
      }
    }
  } catch (e) {
    addLog(`Fallback de imagem do Mercado Livre ignorado: ${e.message}`);
  }
  try {
    const page=await fetchText(url);'''
              if old not in s:
                  raise SystemExit('Não encontrei o início esperado de findProductImage')
              s = s.replace(old, new, 1)

              p.write_text(s, encoding='utf-8')

          # Adiciona uma API de prévia para o painel poder descobrir a imagem
          # antes do agendamento, sem alterar o fluxo de envio já funcional.
          if '/api/link-imagem-preview' not in s:
              route = r'''app.get('/api/link-imagem-preview', async (req,res)=>{
  const url=String(req.query?.url||'').trim();
  if(!url) return res.status(400).json({ok:false,msg:'Informe um link.'});
  try{
    const ml=await findMercadoLivreImageUrl(url);
    if(ml) return res.json({ok:true,imagemUrl:ml,fonte:'mercado-livre'});
    const page=await fetchText(url);
    const candidates=extractImageCandidates(page.data,page.finalUrl);
    if(candidates.length) return res.json({ok:true,imagemUrl:candidates[0],fonte:'metadados',finalUrl:page.finalUrl});
    return res.status(404).json({ok:false,msg:'Nenhuma imagem foi encontrada automaticamente.',finalUrl:page.finalUrl});
  }catch(e){
    return res.status(502).json({ok:false,msg:e.message||'Não foi possível obter a imagem.'});
  }
});

'''
              needle = "app.post('/api/link-agendamentos',(req,res)=>{"
              if needle not in s:
                  raise SystemExit('Não encontrei a rota de agendamentos')
              s = s.replace(needle, route + needle, 1)
              p.write_text(s, encoding='utf-8')

      - name: Validar JavaScript
        run: node --check src/server.js

      - name: Enviar correção para main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "Corrigir imagem automática de links do Mercado Livre"
          git push