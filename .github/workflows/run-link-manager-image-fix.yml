name: Corrigir gerenciador e imagens
on:
  push:
    branches: [fix/link-manager-images-clean]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-link-manager-image-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Playwright
        run: npm install playwright@^1.55.0 --no-audit --no-fund
      - name: Aplicar patch
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const indexFile=path.join(process.cwd(),'public','index.html');
          let index=fs.readFileSync(indexFile,'utf8');
          const a=index.indexOf('async function loadLinks(){');
          const b=index.indexOf('async function loadSchedules(){',a);
          if(a<0||b<0)throw new Error('loadLinks/loadSchedules não encontrados');
          index=index.slice(0,a)+`async function loadLinks(){
            const box=document.getElementById('links');
            if(!box)return;
            box.innerHTML='<div class="muted">Os links salvos aparecem somente em <b>Agendamentos</b>. O Gerenciador de links serve para criar ou editar uma programação.</div>';
          }
          `+index.slice(b);
          index=index.replace('Crie, programe e acompanhe cada envio. A fila continua do último link concluído.','Crie ou edite uma programação. Depois de salvar, ela fica somente em Agendamentos.');
          fs.writeFileSync(indexFile,index,'utf8');

          const serverFile=path.join(process.cwd(),'src','server.js');
          let source=fs.readFileSync(serverFile,'utf8');
          if(!source.includes("require('playwright')")){
            const m="const crypto = require('crypto');";
            if(!source.includes(m))throw new Error('import marker não encontrado');
            source=source.replace(m,m+"\nconst { chromium } = require('playwright');",1);
          }
          if(!source.includes('async function getRegulosBrowser()')){
            const marker='const DEFAULT_RANDOM_MESSAGES = [';
            const idx=source.indexOf(marker);
            if(idx<0)throw new Error('DEFAULT_RANDOM_MESSAGES não encontrado');
            const helper=`
          let regulosBrowserPromise=null;
          async function getRegulosBrowser(){
            if(!regulosBrowserPromise)regulosBrowserPromise=chromium.launch({headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage']}).catch(e=>{regulosBrowserPromise=null;throw e;});
            return regulosBrowserPromise;
          }
          async function findProductImageWithBrowser(url){
            let context=null;
            try{
              await assertSafeExternalUrl(url);
              const browser=await getRegulosBrowser();
              context=await browser.newContext({userAgent:'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/154 Safari/537.36',locale:'pt-BR',viewport:{width:1365,height:900},javaScriptEnabled:true,ignoreHTTPSErrors:true});
              const page=await context.newPage();
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1800);
              const candidates=await page.evaluate(()=>{
                const out=[],seen=new Set(),add=v=>{if(!v||/^data:|^blob:/i.test(v))return;try{const u=new URL(v,location.href).href;if(/^https?:/i.test(u)&&!seen.has(u)){seen.add(u);out.push(u)}}catch{}};
                document.querySelectorAll('meta[property="og:image"],meta[name="twitter:image"],meta[property="og:image:url"]').forEach(x=>add(x.content));
                document.querySelectorAll('img').forEach(img=>{add(img.currentSrc||img.src);['data-src','data-original','data-lazy-src','data-image','data-image-src','data-zoom-image','data-large_image'].forEach(k=>add(img.getAttribute(k)));});
                return out.slice(0,80);
              });
              for(const candidate of candidates){try{const image=await downloadBuffer(candidate,url);await context.close();addLog('Fallback navegador encontrou imagem: '+candidate);return image}catch{}}
              await context.close();
            }catch(e){try{if(context)await context.close()}catch{}addLog('Fallback navegador indisponível: '+e.message)}
            return null;
          }
          `;
            source=source.slice(0,idx)+helper+source.slice(idx);
          }
          const fsx=source.indexOf('async function findProductImage(url) {');
          const fex=source.indexOf('\nconst DEFAULT_RANDOM_MESSAGES = [',fsx);
          if(fsx<0||fex<0)throw new Error('findProductImage não encontrada');
          let fn=source.slice(fsx,fex);
          if(!fn.includes('findProductImageWithBrowser(url)')){
            const r=fn.lastIndexOf('return null;');
            if(r<0)throw new Error('return null não encontrado');
            fn=fn.slice(0,r)+'  const browserImage = await findProductImageWithBrowser(url);\n  if (browserImage) return browserImage;\n'+fn.slice(r);
            source=source.slice(0,fsx)+fn+source.slice(fex);
          }
          fs.writeFileSync(serverFile,source,'utf8');
          NODE
      - name: Validar
        run: node --check src/server.js
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/server.js package.json package-lock.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[auto-link-manager-image-fix] Corrigir gerenciador e imagens"
          git push
