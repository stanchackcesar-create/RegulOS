name: Estabilizar histórico e falhas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-history-stable]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir histórico e falhas sem piscar
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<div id="linkHistory" style="margin-top:10px">Carregando histórico...</div>','<div id="linkHistory" style="margin-top:10px"></div>')
          s=s.replace('<div id="linkFailures" style="margin-top:10px">Carregando falhas...</div>','<div id="linkFailures" style="margin-top:10px"></div>')
          s=s.replace("box.innerHTML='<div class=\"muted\">🔄 Carregando histórico...</div>';",'',1)

          duplicate="""  const signature=JSON.stringify(d.falhas||[]);
  if(signature===lastFailureSignature)return;
  lastFailureSignature=signature;
  const signature=JSON.stringify(d.falhas||[]);
  if(signature===lastFailureSignature)return;
  lastFailureSignature=signature;box.innerHTML='';"""
          single="""  const signature=JSON.stringify(d.falhas||[]);
  if(signature===lastFailureSignature)return;
  lastFailureSignature=signature;box.innerHTML='';"""
          s=s.replace(duplicate,single,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar painel
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          assert 'Carregando histórico...' not in s
          assert 'Carregando falhas...' not in s
          start=s.find('async function loadLinkFailures(){')
          end=s.find('\nasync function ',start+10) if start!=-1 else -1
          block=s[start:end if end!=-1 else len(s)]
          assert block.count("const signature=JSON.stringify(d.falhas||[]);") == 1
          assert block.count("if(signature===lastFailureSignature)return;") == 1
          assert block.count("lastFailureSignature=signature;") == 1
          print('Painel OK')
          PY
          node --check src/server.js

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remover duplicação do histórico de falhas [skip-history-stable]"
          git push
