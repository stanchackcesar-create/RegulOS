name: Estabilizar histórico e falhas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-history-stable]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir histórico e falhas sem piscar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Nunca mostrar placeholders de carregamento nos painéis.
          s = s.replace('<div id="linkHistory" style="margin-top:10px">Carregando histórico...</div>', '<div id="linkHistory" style="margin-top:10px"></div>')
          s = s.replace('<div id="linkFailures" style="margin-top:10px">Carregando falhas...</div>', '<div id="linkFailures" style="margin-top:10px"></div>')

          # A função antiga ainda podia escrever "Carregando histórico..."
          # a cada polling. Remover essa escrita é obrigatório mesmo quando
          # a assinatura já existe.
          s = s.replace("box.innerHTML='<div class=\"muted\">🔄 Carregando histórico...</div>';", '', 1)

          # O histórico já usa assinatura em versões recentes. Se a assinatura
          # não existir, aplica a correção diretamente no carregador.
          if "let lastHistorySignature='';" not in s:
              marker = 'async function loadLinkHistory(){'
              if marker in s:
                  s = s.replace(marker, "let lastHistorySignature='';\n" + marker, 1)
                  s = s.replace("const d=await jfetch('/api/link-historico'); box.innerHTML='';", "const d=await jfetch('/api/link-historico'); const signature=JSON.stringify(d.historico||[]); if(signature===lastHistorySignature)return; lastHistorySignature=signature; box.innerHTML='';", 1)

          # Corrige o painel de falhas com a mesma lógica: só redesenha quando
          # a resposta realmente mudou.
          if "let lastFailureSignature='';" not in s:
              marker = 'async function loadLinkFailures(){'
              if marker in s:
                  s = s.replace(marker, "let lastFailureSignature='';\n" + marker, 1)

          start = s.find('async function loadLinkFailures(){')
          if start != -1:
              end = s.find('\nasync function ', start + 10)
              if end == -1:
                  end = len(s)
              block = s[start:end]
              block = re.sub(r"\s*box\.innerHTML\s*=\s*['\"](?:🔄\s*)?Carregando[^'\"]*['\"]\s*;", '', block, count=1)
              target = "const d=await jfetch('/api/link-falhas');"
              if target in block and 'lastFailureSignature' in s:
                  replacement = target + "\n  const signature=JSON.stringify(d.falhas||[]);\n  if(signature===lastFailureSignature)return;\n  lastFailureSignature=signature;"
                  block = block.replace(target, replacement, 1)
              s = s[:start] + block + s[end:]

          if s == original:
              print('Nenhuma alteração necessária.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Correção aplicada.')
          PY

      - name: Validar
        run: |
          node --check src/server.js
          grep -n "lastHistorySignature\|lastFailureSignature" public/index.html

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Estabilizar histórico e falhas sem carregamento [skip-history-stable]"
          git push
