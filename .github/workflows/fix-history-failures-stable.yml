name: Estabilizar histórico e falhas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip-history-stable]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir histórico e falhas sem piscar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('public/index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('<div id="linkHistory" style="margin-top:10px">Carregando histórico...</div>','<div id="linkHistory" style="margin-top:10px"></div>')
          s=s.replace('<div id="linkFailures" style="margin-top:10px">Carregando falhas...</div>','<div id="linkFailures" style="margin-top:10px"></div>')
          s=s.replace("box.innerHTML='<div class=\"muted\">🔄 Carregando histórico...</div>';",'',1)

          if "let lastHistorySignature='';" not in s:
              marker='async function loadLinkHistory(){'
              if marker in s:
                  s=s.replace(marker,"let lastHistorySignature='';\n"+marker,1)

          start=s.find('async function loadLinkFailures(){')
          if start!=-1:
              end=s.find('\nasync function ',start+10)
              if end==-1: end=len(s)
              block=s[start:end]
              block=re.sub(r"\s*box\.innerHTML\s*=\s*['\"](?:🔄\s*)?Carregando[^'\"]*['\"]\s*;",'',block,count=1)

              target="const d=await jfetch('/api/link-falhas');"
              marker="const signature=JSON.stringify(d.falhas||[]);"
              guard="if(signature===lastFailureSignature)return;"
              assign="lastFailureSignature=signature;"
              if marker not in block:
                  block=block.replace(target,target+'\n  '+marker+'\n  '+guard+'\n  '+assign,1)

              # Collapse repeated signature guards, including when an older
              # patch placed the second assignment on the same line as box.innerHTML.
              first=block.find(marker)
              if first!=-1:
                  after=block[first+len(marker):]
                  after=re.sub(r"\s*"+re.escape(guard)+r"\s*"+re.escape(assign),"",after)
                  after=re.sub(r"\s*"+re.escape(marker),"",after)
                  block=block[:first+len(marker)]+after
                  # Restore exactly one guard and assignment immediately after the signature.
                  block=block.replace(marker,marker+'\n  '+guard+'\n  '+assign,1)

              s=s[:start]+block+s[end:]

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar painel
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('public/index.html').read_text(encoding='utf-8')
          assert 'Carregando histórico...' not in s
          assert 'Carregando falhas...' not in s
          start=s.find('async function loadLinkFailures(){')
          end=s.find('\nasync function ',start+10) if start!=-1 else -1
          block=s[start:end if end!=-1 else len(s)]
          assert block.count("const signature=JSON.stringify(d.falhas||[]);") == 1
          assert block.count("if(signature===lastFailureSignature)return;") == 1
          assert block.count("lastFailureSignature=signature;") == 1
          print('Painel OK')
          PY
          node --check src/server.js

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Normalizar histórico e falhas sem piscar [skip-history-stable]"
          git push
