name: Corrigir envio agendado

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Corrigir bloqueio por imagem automática
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')

          old = """    if (!productImage) {
      const msg = 'Não foi possível encontrar ou baixar a imagem automaticamente.';
      for (const id of targets) upsertLinkFailure(item, id, msg);
      item.status = 'erro'; item.ativo = false; writeJson(FILES.schedules, linkSchedules);
      addLog(`Falha agendamento ${item.nome}: ${msg}`);
      return;
    }
    addLog(`Imagem encontrada para \"${item.nome}\`.`);"""

          new = """    if (!productImage) {
      // A imagem é opcional para a entrega. Não inventamos dados: se a fonte
      // não fornecer uma imagem utilizável, o RegulOS envia o texto e o link.
      addLog(`Imagem automática não encontrada para \"${item.nome}\". Enviando texto/link.`);
    } else {
      addLog(`Imagem encontrada para \"${item.nome}\".`);
    }"""

          # A string acima usa uma variante de escape; aceitar também a forma
          # literal presente no servidor para manter o patch idempotente.
          old2 = old.replace('`);"""', '`."""')
          if old not in s and old2 not in s:
              raise SystemExit('Bloco do bloqueio por imagem automática não encontrado.')
          s = s.replace(old if old in s else old2, new, 1)
          p.write_text(s, encoding='utf-8')
          print('Patch aplicado.')

      - name: Validar Node
        run: node --check src/server.js

      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Corrigir envio agendado sem imagem [skip ci]"
            git push
          fi
