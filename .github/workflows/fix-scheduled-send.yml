name: Corrigir envio agendado com imagem obrigatória

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Exigir imagem válida na oferta automática
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')

          start = s.find('    if (!productImage) {')
          end = s.find('    const startedAt = Date.now();', start)
          if start < 0 or end < 0:
              raise SystemExit('Bloco do envio agendado não encontrado.')

          block = s[start:end]
          replacement = '''    if (!productImage) {
      const msg = 'Não foi possível encontrar ou baixar uma imagem válida da oferta. O envio foi bloqueado para evitar uma oferta sem imagem.';
      for (const id of targets) upsertLinkFailure(item, id, msg);
      item.status = 'erro';
      item.ativo = false;
      writeJson(FILES.schedules, linkSchedules);
      addLog(`Falha agendamento ${item.nome}: ${msg}`);
      return;
    }

    addLog(`Imagem válida encontrada para "${item.nome}". Oferta liberada para envio.`);
'''

          # Substitui qualquer versão anterior do bloco de imagem, inclusive
          # as versões que permitiam enviar somente texto/link.
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          print('Regra de imagem obrigatória aplicada.')

      - name: Validar JavaScript
        run: node --check src/server.js

      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Exigir imagem válida na oferta automática agendada [skip scheduled patch]"
            git push
          fi
