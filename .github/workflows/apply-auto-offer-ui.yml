name: Aplicar UI da oferta automática

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[auto-offer-ui]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar patch da UI
        run: python tools/patch_auto_offer_ui.py
      - name: Validar JavaScript do painel
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('public/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>([\s\S]*?)</script>', text)
          if not scripts: raise SystemExit('Script principal não encontrado')
          Path('/tmp/regulos.js').write_text(scripts[-1],encoding='utf-8')
      - name: Validar
        run: node --check /tmp/regulos.js
      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Aplicar checkbox e montagem automática no Gerenciador [skip ci]"
            git push
          fi
