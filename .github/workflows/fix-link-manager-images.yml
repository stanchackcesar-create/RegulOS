name: Corrigir gerenciador e imagens

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[fix-link-manager-images]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar correções
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          # 1) O Gerenciador de links fica apenas para criar/editar.
          #    Os itens salvos aparecem somente em Agendamentos.
          index = Path('public/index.html')
          text = index.read_text(encoding='utf-8')
          pattern = r"async function loadLinks\(\)\{.*?\n\}\nasync function loadSchedules\(\)\{"
          replacement = '''async function loadLinks(){
            const box=document.getElementById('links');
            if(!box)return;
            box.innerHTML='<div class="muted">Os links salvos aparecem somente em <b>Agendamentos</b>. O Gerenciador de links serve para criar ou editar uma programação.</div>';
          }
          async function loadSchedules(){'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Não foi possível localizar loadLinks() para corrigir o Gerenciador.')
          new_text = new_text.replace(
              'Crie, programe e acompanhe cada envio. A fila continua do último link concluído.',
              'Crie ou edite uma programação. Depois de salvar, ela fica somente em Agendamentos.'
          )
          index.write_text(new_text, encoding='utf-8')

          # 2) Playwright para links encurtados/dinâmicos, especialmente meli.la.
          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          deps = data.setdefault('dependencies', {})
          deps['playwright'] = '^1.55.0'
          package.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          server = Path('src/server.js')
          source = server.read_text(encoding='utf-8')
          if "require('playwright')" not in source:
              marker = "const crypto = require('crypto');"
              source = source.replace(marker, marker + "\nlet chromium = null;\ntry { chromium = require('playwright').chromium; } catch (e) { chromium = null; }", 1)

          # Insere o fallback por navegador antes da função de extração principal.
          browser_helper = r'''
// REGULOS_BROWSER_IMAGE_FALLBACK_V2
let regulosBrowserPromise = null;
async function getRegulosBrowser(){
  if(!chromium) return null;
  if(!regulosBrowserPromise){
    regulosBrowserPromise = chromium.launch({
      headless:true,
      args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--disable-gpu']
    }).catch(e=>{ addLog(`Playwright indisponível: ${e.message}`); regulosBrowserPromise=null; return null; });
  }
  return regulosBrowserPromise;
}

async function findProductImageWithBrowser(url){
  const browser = await getRegulosBrowser();
  if(!browser) return null;
  let page = null;
  try{
    page = await browser.newPage({
      userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',
      viewport:{width:1365,height:900}
    });
    await page.goto(String(url||''), {waitUntil:'domcontentloaded', timeout:30000});
    await page.waitForTimeout(1800);
    const finalUrl = page.url();
    const candidates = await page.evaluate(()=>{
      const out=[];
      const add=v=>{ if(typeof v==='string' && /^https?:\\/\\//i.test(v)) out.push(v); };
      document.querySelectorAll('meta[property="og:image"],meta[name="og:image"],meta[name="twitter:image"],meta[property="twitter:image"]').forEach(x=>add(x.content));
      document.querySelectorAll('link[rel="image_src"]').forEach(x=>add(x.href));
      document.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{
        try{
          const walk=v=>{
            if(!v)return;
            if(typeof v==='string')return add(v);
            if(Array.isArray(v))return v.forEach(walk);
            if(typeof v==='object'){
              if(v.image) walk(v.image);
              if(v.contentUrl) add(v.contentUrl);
              if(v.url && /image|photo|picture/i.test(String(v['@type']||''))) add(v.url);
            }
          };
          walk(JSON.parse(s.textContent||''));
        }catch{}
      });
      document.querySelectorAll('img').forEach(img=>{
        add(img.currentSrc||img.src);
        add(img.getAttribute('data-src'));
        add(img.getAttribute('data-original'));
      });
      return [...new Set(out)].slice(0,25);
    });
    addLog(`🔎 Navegador encontrou ${candidates.length} candidatos de imagem; URL final: ${finalUrl}`);
    await page.close(); page=null;
    for(const imageUrl of candidates){
      try{
        const image=await downloadBuffer(imageUrl, finalUrl || String(url||''));
        addLog(`🖼️ Imagem obtida pelo navegador: ${imageUrl}`);
        return image;
      }catch(e){
        addLog(`Imagem dinâmica recusada: ${e.message}`);
      }
    }
  }catch(e){
    addLog(`Fallback navegador não conseguiu abrir o link: ${e.message}`);
  }finally{
    try{if(page)await page.close();}catch{}
  }
  return null;
}
'''
          if 'REGULOS_BROWSER_IMAGE_FALLBACK_V2' not in source:
              marker = 'async function findProductImage(url) {'
              if marker not in source:
                  raise SystemExit('findProductImage não encontrada.')
              source = source.replace(marker, browser_helper + '\n' + marker, 1)

          # Substitui todas as versões duplicadas de findProductImage por uma única rotina.
          start = source.find('async function findProductImage(url) {')
          end = source.find('const DEFAULT_RANDOM_MESSAGES = [', start)
          if start < 0 or end < 0:
              raise SystemExit('Não foi possível delimitar findProductImage().')
          new_fn = r'''async function findProductImage(url) {
  try {
    const mlImageUrl = await findMercadoLivreImageUrl(url);
    if(mlImageUrl){
      try{
        const image = await downloadBuffer(mlImageUrl, url);
        addLog(`🖼️ Imagem do Mercado Livre encontrada via API: ${mlImageUrl}`);
        return image;
      }catch(e){ addLog(`Imagem da API do Mercado Livre não pôde ser baixada: ${e.message}`); }
    }
  }catch(e){ addLog(`Fallback Mercado Livre ignorado: ${e.message}`); }

  try {
    const page = await fetchText(url);
    const candidates = extractImageCandidates(page.data, page.finalUrl);
    addLog(`🔎 ${candidates.length} candidatos de imagem encontrados para o link.`);
    for(let i=0;i<candidates.length;i++){
      try{
        const image = await downloadBuffer(candidates[i], page.finalUrl);
        addLog(`🖼️ Imagem encontrada na tentativa ${i+1}: ${candidates[i]}`);
        return image;
      }catch(e){ if(i<5) addLog(`Imagem ${i+1} recusada; tentando a próxima.`); }
    }
  }catch(e){ addLog(`Não foi possível ler a página para buscar imagem: ${e.message}`); }

  // Último recurso: abre a página como um navegador real para resolver
  // meli.la e outras páginas que só montam a imagem via JavaScript.
  const browserImage = await findProductImageWithBrowser(url);
  if(browserImage) return browserImage;
  return null;
}
'''
          source = source[:start] + new_fn + source[end:]
          server.write_text(source, encoding='utf-8')
          PY

      - name: Instalar dependências e validar
        run: |
          npm install --package-lock=false --no-audit --no-fund
          node --check src/server.js
          node --check public/index.html 2>/dev/null || true

      - name: Commitar correção
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/server.js package.json
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir gerente de links e imagens [fix-link-manager-images]"
          git push origin HEAD:main
