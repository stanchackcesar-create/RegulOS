name: Corrigir gerenciador e imagens
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[fix-link-manager-images]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correções
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          # Gerenciador: apenas criação/edição. Cartões salvos ficam em Agendamentos.
          p=Path('public/index.html'); s=p.read_text(encoding='utf-8')
          pat=r"async function loadLinks\(\)\{.*?\n\}\nasync function loadSchedules\(\)\{"
          rep='''async function loadLinks(){\n const box=document.getElementById('links');\n if(!box)return;\n box.innerHTML='<div class="muted">Os links salvos aparecem somente em <b>Agendamentos</b>. O Gerenciador de links serve para criar ou editar uma programação.</div>';\n}\nasync function loadSchedules(){'''
          s,n=re.subn(pat,rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('loadLinks não localizado')
          s=s.replace('Crie, programe e acompanhe cada envio. A fila continua do último link concluído.','Crie ou edite uma programação. Depois de salvar, ela fica somente em Agendamentos.')
          p.write_text(s,encoding='utf-8')

          # Playwright: fallback real de navegador para meli.la e páginas dinâmicas.
          q=Path('package.json'); d=json.loads(q.read_text(encoding='utf-8')); d.setdefault('dependencies',{})['playwright']='^1.55.0'; q.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('src/server.js'); s=p.read_text(encoding='utf-8')
          if "require('playwright')" not in s:
            s=s.replace("const crypto = require('crypto');","const crypto = require('crypto');\nlet chromium=null; try { chromium=require('playwright').chromium; } catch(e) { chromium=null; }",1)

          helper=r'''\n// REGULOS_BROWSER_IMAGE_FALLBACK_V2\nlet regulosBrowserPromise=null;\nasync function getRegulosBrowser(){\n if(!chromium)return null;\n if(!regulosBrowserPromise)regulosBrowserPromise=chromium.launch({headless:true,args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage','--disable-gpu']}).catch(e=>{addLog(`Playwright indisponível: ${e.message}`);regulosBrowserPromise=null;return null;});\n return regulosBrowserPromise;\n}\nasync function findProductImageWithBrowser(url){\n const browser=await getRegulosBrowser(); if(!browser)return null; let page=null;\n try{\n  page=await browser.newPage({userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36',viewport:{width:1365,height:900}});\n  await page.goto(String(url||''),{waitUntil:'domcontentloaded',timeout:30000}); await page.waitForTimeout(1800);\n  const finalUrl=page.url();\n  const candidates=await page.evaluate(()=>{\n   const out=[]; const add=v=>{if(typeof v==='string'&&/^https?:\\/\\//i.test(v))out.push(v)};\n   document.querySelectorAll('meta[property="og:image"],meta[name="og:image"],meta[name="twitter:image"],meta[property="twitter:image"]').forEach(x=>add(x.content));\n   document.querySelectorAll('link[rel="image_src"]').forEach(x=>add(x.href));\n   document.querySelectorAll('script[type="application/ld+json"]').forEach(e=>{try{const walk=v=>{if(!v)return;if(typeof v==='string')return add(v);if(Array.isArray(v))return v.forEach(walk);if(typeof v==='object'){if(v.image)walk(v.image);if(v.contentUrl)add(v.contentUrl);}};walk(JSON.parse(e.textContent||''));}catch{}});\n   document.querySelectorAll('img').forEach(x=>{add(x.currentSrc||x.src);add(x.getAttribute('data-src'));add(x.getAttribute('data-original'));});\n   return [...new Set(out)].slice(0,25);\n  });\n  addLog(`🔎 Navegador encontrou ${candidates.length} candidatos de imagem; URL final: ${finalUrl}`);\n  await page.close();page=null;\n  for(const imageUrl of candidates){try{const image=await downloadBuffer(imageUrl,finalUrl||String(url||''));addLog(`🖼️ Imagem obtida pelo navegador: ${imageUrl}`);return image;}catch(e){}}\n }catch(e){addLog(`Fallback navegador não conseguiu abrir o link: ${e.message}`);} finally{try{if(page)await page.close()}catch{}}\n return null;\n}\n'''
          if 'REGULOS_BROWSER_IMAGE_FALLBACK_V2' not in s:
            s=s.replace('async function findProductImage(url) {',helper+'\nasync function findProductImage(url) {',1)
          start=s.find('async function findProductImage(url) {'); end=s.find('const DEFAULT_RANDOM_MESSAGES = [',start)
          if start<0 or end<0: raise SystemExit('findProductImage não delimitada')
          fn='''async function findProductImage(url) {\n try {\n  const ml=await findMercadoLivreImageUrl(url);\n  if(ml){try{return await downloadBuffer(ml,url)}catch(e){addLog(`Imagem da API ML não pôde ser baixada: ${e.message}`)}}\n }catch(e){addLog(`Fallback ML ignorado: ${e.message}`)}\n try {\n  const page=await fetchText(url); const candidates=extractImageCandidates(page.data,page.finalUrl);\n  for(const imageUrl of candidates){try{return await downloadBuffer(imageUrl,page.finalUrl)}catch(e){}}\n }catch(e){addLog(`Não foi possível ler a página para buscar imagem: ${e.message}`)}\n const browserImage=await findProductImageWithBrowser(url); if(browserImage)return browserImage;\n return null;\n}\n'''
          s=s[:start]+fn+s[end:]; p.write_text(s,encoding='utf-8')
          PY
      - name: Instalar e validar
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npx playwright install chromium
          node --check src/server.js
          git diff --check
      - name: Gravar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/server.js package.json
          git diff --cached --quiet && exit 0
          git commit -m "Corrigir gerente de links e imagens [fix-link-manager-images]"
          git push origin HEAD:main
