name: Corrigir edição duplicando agendamentos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir referência do ID de edição
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          old = "const endpoint=window.editingId?('/api/link-agendamentos/'+encodeURIComponent(window.editingId)):'/api/link-agendamentos';\n const method=window.editingId?'PUT':'POST';"
          new = "const endpoint=editingId?('/api/link-agendamentos/'+encodeURIComponent(editingId)):'/api/link-agendamentos';\n const method=editingId?'PUT':'POST';"
          if old not in s:
              if new in s:
                  print('Correção de edição já aplicada.')
              else:
                  raise SystemExit('Trecho de saveLink para edição não encontrado.')
          else:
              s = s.replace(old, new, 1)
              s = s.replace("toast(window.editingId?'Agendamento atualizado.':'Agendamento salvo com sucesso.')", "toast(editingId?'Agendamento atualizado.':'Agendamento salvo com sucesso.')", 1)
              p.write_text(s, encoding='utf-8')
              print('Correção aplicada: Editar agora usa PUT no agendamento existente.')
          PY

      - name: Validar
        run: |
          grep -q "const endpoint=editingId?" public/index.html
          grep -q "const method=editingId?'PUT':'POST'" public/index.html

      - name: Commitar correção
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git commit -m 'Corrigir edição sem duplicar agendamento'
          git push
