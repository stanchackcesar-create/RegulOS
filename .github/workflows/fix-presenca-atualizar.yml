name: Corrigir presença e Atualizar do RegulOS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar correção
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          marker = "async function accountHeartbeat(){\n  try{ await fetch('/api/auth/heartbeat',{method:'POST',cache:'no-store',credentials:'same-origin'}); }\n  catch{}\n}\n"

          addition = marker + "async function refreshAccountPresence(){\n  const panel=document.getElementById('accountPanel');\n  if(!panel) return;\n  try{\n    const d=await jfetch('/api/usuarios');\n    const usuarios=Array.isArray(d.usuarios)?d.usuarios:[];\n    const rows=[...panel.querySelectorAll('.account-user-row[data-user-id]')];\n    rows.forEach(row=>{\n      const user=usuarios.find(x=>String(x.id)===String(row.dataset.userId));\n      if(!user) return;\n      const online=Boolean(user.online);\n      const dot=row.querySelector('.presence-dot');\n      const status=row.querySelector('.account-user-status');\n      if(dot){\n        dot.classList.toggle('presence-online',online);\n        dot.classList.toggle('presence-offline',!online);\n        dot.title=online?'Online':'Offline';\n      }\n      if(status){\n        status.textContent=online?'Online':'Offline';\n        status.classList.toggle('status-online',online);\n        status.classList.toggle('status-offline',!online);\n      }\n    });\n  }catch(e){ console.debug('Falha ao atualizar presença:',e); }\n}\n"

          if "async function refreshAccountPresence(){" not in text:
              if marker not in text:
                  raise SystemExit('Marcador accountHeartbeat não encontrado')
              text = text.replace(marker, addition, 1)

          path.write_text(text, encoding='utf-8')

      - name: Verificar sintaxe JavaScript
        shell: python {0}
        run: |
          from pathlib import Path
          text=Path('public/index.html').read_text(encoding='utf-8')
          js=text.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/regulos.js').write_text(js,encoding='utf-8')

      - name: Validar JavaScript com Node
        run: node --check /tmp/regulos.js

      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Corrigir presença em tempo real"
          git push
