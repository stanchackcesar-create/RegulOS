name: Corrigir presença e Atualizar do RegulOS

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar correção
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')

          marker = "async function accountHeartbeat(){\n  try{ await fetch('/api/auth/heartbeat',{method:'POST',cache:'no-store',credentials:'same-origin'}); }\n  catch{}\n}\n"

          if "async function refreshAccountPresence(){" not in text:
              addition = marker + """async function refreshAccountPresence(){
            const list=document.getElementById('userList');
            if(!list)return;
            try{
              const d=await jfetch('/api/usuarios');
              const users=Array.isArray(d.usuarios)?d.usuarios:[];
              const rows=[...list.querySelectorAll('[data-user-id]')];
              users.forEach(x=>{
                const row=rows.find(r=>r.dataset.userId===String(x.id));
                if(!row)return;
                const online=Boolean(x.online);
                const dot=row.querySelector('.presence-dot');
                const status=row.querySelector('.account-user-status');
                if(dot){dot.classList.toggle('presence-online',online);dot.classList.toggle('presence-offline',!online);dot.title=online?'Online':'Offline';}
                if(status){status.textContent=online?'Online':'Offline';status.classList.toggle('status-online',online);status.classList.toggle('status-offline',!online);}
              });
            }catch(e){console.debug('Falha ao atualizar presença:',e);}
          }
          """
              if marker not in text:
                  raise SystemExit('Marcador accountHeartbeat não encontrado')
              text = text.replace(marker, addition, 1)

          # Identificação das linhas de usuário.
          text=text.replace('html+=`<div class="group account-user-row">','html+=`<div class="group account-user-row" data-user-id="${esc(x.id)}">',1)

          # Substitui qualquer versão anterior do refreshAll por uma versão robusta.
          start=text.find('async function refreshAll(){')
          if start>=0:
              depth=0; end=None
              i=text.find('{',start)
              while i<len(text):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0:
                          end=i+1; break
                  i+=1
              if end:
                  replacement="""async function refreshAll(){
            if(window.__regulosRefreshBusy)return;
            window.__regulosRefreshBusy=true;
            const btn=document.querySelector('.actions button.primary');
            const oldText=btn?.textContent||'🔄 Atualizar';
            if(btn){btn.disabled=true;btn.textContent='🔄 Atualizando...';}
            const tasks=[status,loadGroups,loadLinks,loadSchedules,loadLinkHistory,loadLinkFailures,loadLogs,loadDashboard,refreshAccountPresence];
            const results=await Promise.all(tasks.map(async fn=>{
              try{await Promise.race([Promise.resolve().then(fn),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);return true;}
              catch(e){console.debug('Atualização falhou:',e);return false;}
            }));
            const failed=results.filter(x=>!x).length;
            if(btn){btn.disabled=false;btn.textContent=oldText;}
            window.__regulosRefreshBusy=false;
            try{toast(failed?`Atualização concluída; ${failed} item(ns) não responderam.`:'Atualizado com sucesso.',failed>0);}catch{}
          }"""
                  text=text[:start]+replacement+text[end:]

          # Presença independente: 5 segundos e imediatamente após carregar a conta.
          if 'setInterval(()=>{refreshAccountPresence();},5000);' not in text:
              insert_marker='setInterval(accountHeartbeat,15000);'
              text=text.replace(insert_marker,insert_marker+"\nsetInterval(()=>{refreshAccountPresence();},5000);\nsetTimeout(()=>{refreshAccountPresence();},1500);",1)

          # Evita que o navegador sirva uma versão antiga do painel.
          if '<meta http-equiv="Cache-Control"' not in text:
              text=text.replace('<meta charset="utf-8">','<meta charset="utf-8">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">',1)

          path.write_text(text, encoding='utf-8')

      - name: Corrigir cache do servidor
        shell: python {0}
        run: |
          from pathlib import Path
          path=Path('src/server.js')
          text=path.read_text(encoding='utf-8')
          if 'function regulosNoStore(res)' not in text:
              marker="app.get('/api/network',(req,res)=>res.json({ok:true,host:HOST,port:PORT,lan:getLanAddresses().map(ip=>`http://${ip}:${PORT}`)}));"
              addition=marker+"\n\nfunction regulosNoStore(res){\n  res.setHeader('Cache-Control','no-store, no-cache, must-revalidate, proxy-revalidate');\n  res.setHeader('Pragma','no-cache');\n  res.setHeader('Expires','0');\n}\n"
              if marker in text:text=text.replace(marker,addition,1)
          text=text.replace("app.get('/',(req,res)=>res.sendFile(path.join(PUBLIC,'index.html')));","app.get('/',(req,res)=>{regulosNoStore(res);res.sendFile(path.join(PUBLIC,'index.html'));});",1)
          text=text.replace("app.get('*',(req,res)=>res.sendFile(path.join(PUBLIC,'index.html')));","app.get('*',(req,res)=>{regulosNoStore(res);res.sendFile(path.join(PUBLIC,'index.html'));});",1)
          path.write_text(text,encoding='utf-8')

      - name: Verificar sintaxe JavaScript
        shell: python {0}
        run: |
          from pathlib import Path
          text=Path('public/index.html').read_text(encoding='utf-8')
          js=text.split('<script>',1)[1].rsplit('</script>',1)[0]
          Path('/tmp/regulos.js').write_text(js,encoding='utf-8')

      - name: Validar JavaScript com Node
        run: node --check /tmp/regulos.js

      - name: Commit da correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/server.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "Corrigir presença real e botão Atualizar [skip ci]"
          git push
