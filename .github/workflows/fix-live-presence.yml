name: Fix live user presence

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-ui:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch RegulOS UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('public/index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # Keep each user row identifiable so presence can be updated without
          # rebuilding the whole account panel (which would erase form input).
          old_row = 'html+=`<div class="group account-user-row">'
          new_row = 'html+=`<div class="group account-user-row" data-user-id="${esc(x.id)}">'
          if old_row in text and 'data-user-id="${esc(x.id)}"' not in text:
              text = text.replace(old_row, new_row, 1)

          # Live presence updater.
          marker = 'async function createUser(){'
          if 'async function refreshAccountPresence(){' not in text and marker in text:
              presence = r'''async function refreshAccountPresence(){
            const list=document.getElementById('userList');
            if(!list)return;
            try{
              const d=await jfetch('/api/usuarios');
              const users=Array.isArray(d.usuarios)?d.usuarios:[];
              const rows=[...list.querySelectorAll('[data-user-id]')];
              users.forEach(x=>{
                const row=rows.find(r=>r.dataset.userId===String(x.id));
                if(!row)return;
                const online=Boolean(x.online);
                const dot=row.querySelector('.presence-dot');
                const status=row.querySelector('.account-user-status');
                if(dot){dot.classList.toggle('presence-online',online);dot.classList.toggle('presence-offline',!online);dot.title=online?'Online':'Offline';}
                if(status){status.textContent=online?'Online':'Offline';status.classList.toggle('status-online',online);status.classList.toggle('status-offline',!online);}
              });
            }catch(e){console.debug('Falha ao atualizar presença:',e);}
          }
          '''
              text = text.replace(marker, presence + marker, 1)

          # Make the refresh button deterministic even if one endpoint is slow.
          # Defining this at the end intentionally overrides older refreshAll versions.
          override_marker = '\n</script>\n</body>'
          override = r'''
          let regulosRefreshBusy=false;
          async function regulosRefreshAll(){
            if(regulosRefreshBusy)return;
            regulosRefreshBusy=true;
            const btn=document.querySelector('.actions button.primary');
            const oldText=btn?.textContent||'🔄 Atualizar';
            if(btn){btn.disabled=true;btn.textContent='🔄 Atualizando...';}
            const tasks=[
              ['WhatsApp',status],['Grupos',loadGroups],['Links',loadLinks],
              ['Agendamentos',loadSchedules],['Histórico',loadLinkHistory],
              ['Falhas',loadLinkFailures],['Logs',loadLogs],['Painel',loadDashboard],
              ['Usuários',refreshAccountPresence]
            ];
            const results=await Promise.all(tasks.map(async([name,fn])=>{
              try{
                await Promise.race([Promise.resolve().then(fn),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))]);
                return {name,ok:true};
              }catch(e){return {name,ok:false,error:e};}
            }));
            const failed=results.filter(x=>!x.ok);
            if(btn){btn.disabled=false;btn.textContent=oldText;}
            regulosRefreshBusy=false;
            try{toast(failed.length?`Atualização concluída; ${failed.length} item(ns) não responderam.`:'Atualizado com sucesso.',failed.length>0);}catch{}
          }
          window.refreshAll=regulosRefreshAll;

          // Presence must refresh independently of the heavier panel polling.
          setInterval(()=>{refreshAccountPresence();},5000);
          setTimeout(()=>{refreshAccountPresence();},1500);
          '''
          if 'window.refreshAll=regulosRefreshAll;' not in text:
              text = text.replace(override_marker, '\n' + override + override_marker, 1)

          # Prevent stale browser caches from keeping the old JavaScript/HTML.
          if '<meta http-equiv="Cache-Control"' not in text:
              text = text.replace('<meta charset="utf-8">', '<meta charset="utf-8">\n<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">', 1)

          if text == original:
              raise SystemExit('Nenhuma alteração encontrada; abortando para evitar commit vazio.')
          path.write_text(text, encoding='utf-8')
          print('Patched public/index.html')

      - name: Patch server cache headers
        shell: python
        run: |
          from pathlib import Path
          path=Path('src/server.js')
          text=path.read_text(encoding='utf-8')
          marker="app.get('/api/network',(req,res)=>res.json({ok:true,host:HOST,port:PORT,lan:getLanAddresses().map(ip=>`http://${ip}:${PORT}`)}));"
          insert="""app.get('/api/network',(req,res)=>res.json({ok:true,host:HOST,port:PORT,lan:getLanAddresses().map(ip=>`http://${ip}:${PORT}`)}));

// O painel precisa sempre receber o HTML/JS atual para evitar que o navegador
// mantenha uma versão antiga do botão Atualizar ou da presença dos usuários.
function noStore(res){
  res.setHeader('Cache-Control','no-store, no-cache, must-revalidate, proxy-revalidate');
  res.setHeader('Pragma','no-cache');
  res.setHeader('Expires','0');
}
"""
          if 'function noStore(res)' not in text:
              text=text.replace(marker,insert,1)
          text=text.replace("app.get('/',(req,res)=>res.sendFile(path.join(PUBLIC,'index.html')));", "app.get('/',(req,res)=>{noStore(res);res.sendFile(path.join(PUBLIC,'index.html'));});",1)
          text=text.replace("app.get('*',(req,res)=>res.sendFile(path.join(PUBLIC,'index.html')));", "app.get('*',(req,res)=>{noStore(res);res.sendFile(path.join(PUBLIC,'index.html'));});",1)
          path.write_text(text,encoding='utf-8')
          print('Patched src/server.js')

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/server.js
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Corrigir presença e atualização do painel [skip ci]"
          git push origin HEAD:main
