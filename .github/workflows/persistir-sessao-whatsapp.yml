name: Persistir sessão do WhatsApp no volume

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[persistencia-auth]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar diretórios persistentes do RegulOS
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/server.js')
          s = p.read_text(encoding='utf-8')

          old = "const DATA = process.env.REGULOS_DATA_DIR || path.join(ROOT, 'data');\nconst AUTH = process.env.REGULOS_AUTH_DIR || path.join(ROOT, 'auth');"
          new = """const PERSISTENT_ROOT = process.env.REGULOS_PERSISTENT_DIR || (fs.existsSync('/app/storage') ? '/app/storage' : '');
const DATA = process.env.REGULOS_DATA_DIR || (PERSISTENT_ROOT ? path.join(PERSISTENT_ROOT, 'data') : path.join(ROOT, 'data'));
const AUTH = process.env.REGULOS_AUTH_DIR || (PERSISTENT_ROOT ? path.join(PERSISTENT_ROOT, 'auth') : path.join(ROOT, 'auth'));"""

          if old not in s:
              raise SystemExit('Padrão esperado não encontrado em src/server.js')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validar JavaScript
        run: node --check src/server.js

      - name: Commitar correção
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git diff --cached --quiet && exit 0
          git commit -m "Persistir sessão WhatsApp no volume [persistencia-auth]"
          git push
