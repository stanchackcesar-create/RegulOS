name: Validate RegulOS server

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server syntax
        run: node --check src/server.js
      - name: Check startup helpers
        run: |
          node --check tools/cloud-start.js
          node --check tools/mobile-scroll-tabs.js
