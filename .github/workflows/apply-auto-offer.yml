name: Aplicar montagem automática de ofertas

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[auto-offer]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar patch
        run: python tools/auto_offer_patch.py

      - name: Validar servidor
        run: node --check src/server.js

      - name: Commitar integração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js public/index.html public/auto-offer.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Integrar montagem automática de ofertas [skip ci]"
            git push
          fi
