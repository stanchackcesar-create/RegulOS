name: Corrigir RegulOS na main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[fix-linked-groups]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir presença, Atualizar e usuários
        shell: python
        run: |
          from pathlib import Path
          import re

          index = Path('public/index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('async async function loadAccount(){', 'async function loadAccount(){', 1)
          old_row = 'html+=`<div class="group account-user-row">'
          new_row = 'html+=`<div class="group account-user-row" data-user-id="${esc(x.id)}">'
          if old_row in text:
              text = text.replace(old_row, new_row, 1)
          if 'async function refreshAccountPresence(){' not in text:
              marker = 'async function createUser(){'
              presence = r'''async function refreshAccountPresence(){
            const list=document.getElementById('userList');
            if(!list)return;
            try{
              const d=await jfetch('/api/usuarios');
              const users=Array.isArray(d.usuarios)?d.usuarios:[];
              users.forEach(x=>{
                const row=list.querySelector(`[data-user-id="${CSS.escape(String(x.id))}"]`);
                if(!row)return;
                const online=Boolean(x.online);
                const dot=row.querySelector('.presence-dot');
                const status=row.querySelector('.account-user-status');
                if(dot){dot.classList.toggle('presence-online',online);dot.classList.toggle('presence-offline',!online);dot.title=online?'Online':'Offline';}
                if(status){status.textContent=online?'Online':'Offline';status.classList.toggle('status-online',online);status.classList.toggle('status-offline',!online);}
              });
            }catch(e){console.debug('Falha ao atualizar presença:',e);}
          }
          '''
              if marker not in text:
                  raise SystemExit('Marcador createUser não encontrado.')
              text = text.replace(marker, presence + marker, 1)
          start=text.find('async function refreshAll(){')
          if start < 0:
              raise SystemExit('Função refreshAll não encontrada.')
          brace=text.find('{',start)
          depth=0
          end=None
          for i in range(brace,len(text)):
              if text[i]=='{': depth+=1
              elif text[i]=='}':
                  depth-=1
                  if depth==0:
                      end=i+1
                      break
          if end is None:
              raise SystemExit('Não foi possível delimitar refreshAll.')
          replacement='''async function refreshAll(){
            if(window.__regulosRefreshBusy)return;
            window.__regulosRefreshBusy=true;
            const btn=document.querySelector('.actions button.primary');
            const oldText=btn?.textContent||'🔄 Atualizar';
            if(btn){btn.disabled=true;btn.textContent='🔄 Atualizando...';}
            const tasks=[status,loadGroups,loadLinks,loadSchedules,loadLinkHistory,loadLinkFailures,loadLogs,loadDashboard,refreshAccountPresence];
            const results=await Promise.all(tasks.map(async fn=>{
              try{
                await Promise.race([Promise.resolve().then(fn),new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),8000))]);
                return true;
              }catch(e){console.debug('Atualização falhou:',e);return false;}
            }));
            const failed=results.filter(x=>!x).length;
            if(btn){btn.disabled=false;btn.textContent=oldText;}
            window.__regulosRefreshBusy=false;
            try{toast(failed?`Atualização concluída; ${failed} item(ns) não responderam.`:'Atualizado com sucesso.',failed>0);}catch{}
          }'''
          text=text[:start]+replacement+text[end:]
          if 'setInterval(()=>{refreshAccountPresence();},5000);' not in text:
              marker='setInterval(accountHeartbeat,15000);'
              if marker in text:
                  text=text.replace(marker,marker+'\nsetInterval(()=>{refreshAccountPresence();},5000);\nsetTimeout(()=>{refreshAccountPresence();},1500);',1)
              else:
                  text=text.replace('</script>','setInterval(()=>{refreshAccountPresence();},5000);\nsetTimeout(()=>{refreshAccountPresence();},1500);\n</script>',1)
          index.write_text(text,encoding='utf-8')

          server = Path('src/server.js')
          text = server.read_text(encoding='utf-8')
          old = "if(currentUsers.length >= 2) return res.status(409).json({ok:false,msg:'O RegulOS Cloud permite no máximo 2 usuários: administrador e operador.'});"
          if old in text:
              text = text.replace(old, "if(currentUsers.length >= 20) return res.status(409).json({ok:false,msg:'O RegulOS permite no máximo 20 usuários.'});", 1)
          server.write_text(text,encoding='utf-8')

      - name: Validar JavaScript do painel
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('public/index.html').read_text(encoding='utf-8')
          matches=re.findall(r'<script>([\s\S]*?)</script>',text)
          if not matches:
              raise SystemExit('Bloco principal <script> não encontrado.')
          Path('/tmp/regulos.js').write_text(matches[-1],encoding='utf-8')

      - name: Validar sintaxe com Node
        run: node --check /tmp/regulos.js

      - name: Validar servidor
        run: node --check src/server.js

      - name: Commit das correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/server.js
          if git diff --cached --quiet; then
            echo "Nenhuma correção pendente."
            exit 0
          fi
          git commit -m "Corrigir Atualizar e presença em tempo real [skip ci]"
          git push origin HEAD:main
