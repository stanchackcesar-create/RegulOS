name: Corrigir RegulOS na main

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir JavaScript e limite de usuários
        shell: python
        run: |
          from pathlib import Path

          index = Path('public/index.html')
          text = index.read_text(encoding='utf-8')

          # Corrige o erro de sintaxe que interrompe todo o JavaScript do painel.
          text = text.replace('function loadAccount(){', 'async function loadAccount(){', 1)

          # Garante que o botão Atualizar e a presença tenham funções assíncronas válidas.
          index.write_text(text, encoding='utf-8')

          server = Path('src/server.js')
          text = server.read_text(encoding='utf-8')
          old = "if(currentUsers.length >= 2) return res.status(409).json({ok:false,msg:'O RegulOS Cloud permite no máximo 2 usuários: administrador e operador.'});"
          if old in text:
              text = text.replace(old, "if(currentUsers.length >= 20) return res.status(409).json({ok:false,msg:'O RegulOS permite no máximo 20 usuários.'});", 1)
          server.write_text(text, encoding='utf-8')

      - name: Validar JavaScript do painel
        shell: python
        run: |
          from pathlib import Path
          import re
          text = Path('public/index.html').read_text(encoding='utf-8')
          match = re.search(r'<script>([\s\S]*?)</script>', text)
          if not match:
              raise SystemExit('Bloco principal <script> não encontrado.')
          Path('/tmp/regulos.js').write_text(match.group(1), encoding='utf-8')

      - name: Validar sintaxe com Node
        run: node --check /tmp/regulos.js

      - name: Commit das correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html src/server.js
          if git diff --cached --quiet; then
            echo "Nenhuma correção pendente."
            exit 0
          fi
          git commit -m "Corrigir Atualizar, presença e usuários [skip ci]"
          git push origin HEAD:main
