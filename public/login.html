<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — RegulOS</title><style>body{margin:0;background:#080e1a;color:#eef3ff;font-family:Segoe UI,Arial;display:flex;min-height:100vh;align-items:center;justify-content:center}.box{width:min(420px,92vw);background:#111b2d;border:1px solid #263653;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0008}h1{margin:0 0 8px}p{color:#9eb0ca}label{display:block;margin:14px 0 6px;color:#c6d2e7;font-size:13px}input{width:100%;box-sizing:border-box;background:#07101f;color:#eef3ff;border:1px solid #34445c;border-radius:9px;padding:12px;font:inherit}button{width:100%;margin-top:18px;border:0;border-radius:9px;padding:12px;background:#3d83f6;color:white;font-weight:800;cursor:pointer}.err{margin-top:12px;padding:10px;border-radius:9px;background:#481c27;color:#ffd3d8}.small{font-size:12px;color:#7f91ac;text-align:center;margin-top:16px}</style></head><body><div class="box"><h1>⚙️ RegulOS</h1><p>Entre para acessar o painel compartilhado.</p><form id="f"><label>Usuário</label><input id="u" autocomplete="username" required><label>Senha</label><input id="s" type="password" autocomplete="current-password" required><button>Entrar</button></form><div id="e"></div><div class="small">A sessão do WhatsApp e os dados continuam compartilhados entre os usuários autorizados.</div></div><script>async function init(){try{const r=await fetch('/api/auth/status');const d=await r.json();if(d.autenticado)location.href='/';if(!d.configurado)location.href='/configurar';}catch(e){document.getElementById('e').textContent='Servidor indisponível.'}}document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:u.value,senha:s.value})});const d=await r.json();if(r.ok)location.href='/';else document.getElementById('e').className='err',document.getElementById('e').textContent=d.msg||'Não foi possível entrar.'};init();</script></body></html>
