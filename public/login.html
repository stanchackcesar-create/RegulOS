<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/icons/regulos.svg">
<link rel="apple-touch-icon" href="/icons/regulos.svg">

<title>Entrar — RegulOS</title>
<style>
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  overflow:auto;
  color:#eef7ff;
  font-family:Segoe UI,Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 38%,rgba(22,106,170,.18),transparent 28%),
    radial-gradient(circle at 15% 80%,rgba(34,211,238,.08),transparent 25%),
    radial-gradient(circle at 85% 20%,rgba(61,131,246,.09),transparent 25%),
    linear-gradient(135deg,#02050c 0%,#06101d 48%,#02050b 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(rgba(34,211,238,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.025) 1px,transparent 1px);
  background-size:55px 55px;
  mask-image:linear-gradient(to bottom,transparent 0%,black 35%,black 70%,transparent 100%);
}
.wallpaper{
  position:fixed;
  width:min(980px,78vw);
  height:auto;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  opacity:.18;
  filter:drop-shadow(0 0 28px rgba(34,211,238,.24));
  pointer-events:none;
}
.wallpaper:after{content:""}
.box{
  position:relative;
  z-index:2;
  width:min(420px,92vw);
  max-height:calc(100vh - 32px);
  overflow-y:auto;
  padding:24px;
  background:linear-gradient(145deg,rgba(12,25,43,.94),rgba(5,12,22,.94));
  border:1px solid rgba(34,211,238,.32);
  border-radius:18px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.045),
    0 25px 80px rgba(0,0,0,.65),
    0 0 35px rgba(34,211,238,.1);
  backdrop-filter:blur(14px);
}
.box:before{
  content:"";
  position:absolute;
  left:28px;right:28px;top:0;
  height:2px;
  background:linear-gradient(90deg,transparent,#22d3ee,transparent);
  box-shadow:0 0 14px rgba(34,211,238,.6);
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;
  color:#fff;font-size:22px;font-weight:900;
  background:linear-gradient(135deg,#2563eb,#06b6d4);
  border:1px solid #72eaff;
  box-shadow:0 0 20px rgba(34,211,238,.28);
}
h1{margin:0;font-size:29px;letter-spacing:-.5px}
h1 span{color:#22d3ee;text-shadow:0 0 14px rgba(34,211,238,.32)}
p{color:#9eb0ca;margin:0 0 18px}
label{display:block;margin:14px 0 6px;color:#cbd8ea;font-size:13px}
input{
  width:100%;height:46px;
  box-sizing:border-box;
  background:#07111f!important;
  color:#eef7ff!important;
  border:1px solid #334c6d;
  border-radius:9px;
  padding:12px;
  font:inherit;
  outline:none;
}
input:focus{
  border-color:#22d3ee;
  box-shadow:0 0 0 2px rgba(34,211,238,.08),0 0 18px rgba(34,211,238,.12);
}
input:-webkit-autofill,
input:-webkit-autofill:hover,
input:-webkit-autofill:focus{
  -webkit-text-fill-color:#eef7ff!important;
  -webkit-box-shadow:0 0 0 1000px #07111f inset!important;
  box-shadow:0 0 0 1000px #07111f inset!important;
  caret-color:#eef7ff;
}
button{
  width:100%;
  height:46px;
  margin-top:18px;
  border:1px solid #70eaff;
  border-radius:9px;
  padding:12px;
  background:linear-gradient(135deg,#286fe4,#06aeca);
  color:white;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 20px rgba(34,211,238,.16),0 8px 20px rgba(0,0,0,.28);
  transition:filter .16s ease,box-shadow .16s ease;
}
button:hover{filter:brightness(1.08);box-shadow:0 0 26px rgba(34,211,238,.28),0 9px 22px rgba(0,0,0,.32)}
.err{margin-top:12px;padding:10px;border-radius:9px;background:#481c27;color:#ffd3d8;border:1px solid #ef444466}
.small{font-size:12px;color:#7f91ac;text-align:center;margin-top:16px;line-height:1.45}
@media(max-width:600px){
  body{overflow:auto;padding:18px}
  .wallpaper{width:125vw;top:50%;opacity:.12}
  .box{width:100%;padding:24px 20px}
}
</style>
</head>
<body>
<img class="wallpaper" src="/regulos-login-wallpaper.svg" alt="">
<div class="box">
  <div class="brand"><div class="brand-mark">R</div><h1>Regul<span>OS</span></h1></div>
  <p>Entre para acessar o painel compartilhado.</p>
  <form id="f">
    <label>Usuário ou e-mail</label><input id="u" autocomplete="username" placeholder="Digite seu usuário ou e-mail" required>
    <label>Senha</label><input id="s" type="password" autocomplete="current-password" required>
    <div class="captcha-box" style="margin-top:12px;padding:12px;border:1px solid #35506f;border-radius:9px;background:#071321"><label id="loginCaptchaQuestion" style="margin:0 0 7px">Carregando desafio...</label><input id="loginCaptchaAnswer" inputmode="numeric" autocomplete="off" placeholder="Resposta do CAPTCHA" required><input id="loginCaptchaId" type="hidden"></div>
    <button>Entrar</button>
  </form>
  <button type="button" id="showRegister" style="margin-top:10px;background:transparent;border:1px solid #35506f;box-shadow:none;color:#9fefff">Criar minha conta</button>
  <form id="registerForm" style="display:none;margin-top:10px">
    <label>Novo usuário</label><input id="newUser" autocomplete="username" minlength="3" maxlength="32" required pattern="[a-zA-Z0-9._-]{3,32}">
    <label>E-mail</label><input id="newEmail" type="email" autocomplete="email" required><label>Senha (mínimo 8 caracteres)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
    <div class="captcha-box" style="margin:12px 0;padding:12px;border:1px solid #35506f;border-radius:9px;background:#071321"><label id="registerCaptchaQuestion" style="margin:0 0 7px">Carregando desafio...</label><input id="registerCaptchaAnswer" inputmode="numeric" autocomplete="off" placeholder="Resposta do CAPTCHA" required><input id="registerCaptchaId" type="hidden"></div>
    <div style="margin:12px 0;padding:12px;border:1px solid #35506f;border-radius:10px;background:#071321">
      <label style="display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.45">
        <input id="acceptRegulosPolicy" type="checkbox" required style="width:auto;min-width:17px;margin-top:3px">
        <span>Li e aceito a <a href="/politica-regulos.html" target="_blank" rel="noopener" style="color:#9fefff">Política de Uso e Regras do RegulOS</a>, incluindo o aviso de riscos e restrições que o WhatsApp pode aplicar a mensagens automáticas ou em massa não autorizadas.</span>
      </label>
      <p style="font-size:12px;color:#a8b7ce;margin:8px 0 0">O aceite será registrado com a versão da política e a data/hora.</p>
    </div>
    <button type="submit">Aceitar termos e criar conta</button>
  </form>
  <button type="button" id="forgot" style="margin-top:10px;background:transparent;border:1px solid #35506f;box-shadow:none;color:#9fefff">Esqueci minha senha</button>
  <button type="button" id="backToLogin" style="display:none;margin-top:10px;background:transparent;border:1px solid #35506f;box-shadow:none;color:#9fefff">Voltar para entrar</button>
  <form id="rf" style="display:none;margin-top:10px">
    <label>E-mail cadastrado</label><input id="recoveryEmail" type="email" autocomplete="email" required>
    <button type="button" id="sendRecovery">Enviar código de recuperação</button>
    <label>Código recebido por e-mail</label><input id="recoveryCode" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" required>
    <label>Nova senha (mínimo 8 caracteres)</label><input id="rs" type="password" autocomplete="new-password" minlength="8" required>
    <button type="submit">Redefinir senha</button>
  </form>
  <form id="verifyForm" style="display:none;margin-top:10px">
    <label>Usuário cadastrado</label><input id="verifyUser" autocomplete="username" required>
    <label>Código de confirmação do e-mail</label><input id="verifyCode" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" required>
    <button type="submit">Confirmar e-mail</button>
    <button type="button" id="resendVerification" style="margin-top:10px;background:transparent;border:1px solid #35506f;box-shadow:none;color:#9fefff">Reenviar código</button>
  </form>
  <div id="e"></div>
</div>
<script>

async function loadAuthCaptcha(purpose){
  const prefix=purpose==='login'?'login':'register';
  const question=document.getElementById(prefix+'CaptchaQuestion');
  const idField=document.getElementById(prefix+'CaptchaId');
  const answerField=document.getElementById(prefix+'CaptchaAnswer');
  if(!question||!idField||!answerField)return;
  question.textContent='Carregando desafio...'; idField.value=''; answerField.value='';
  try{
    const r=await fetch('/api/auth/captcha?purpose='+encodeURIComponent(purpose),{cache:'no-store'});
    const d=await r.json();
    if(!r.ok||!d.ok)throw Error('Não foi possível carregar o CAPTCHA.');
    question.textContent=d.question; idField.value=d.id;
  }catch(err){question.textContent='Falha ao carregar o CAPTCHA. Recarregue a página.';}
}

async function init(){try{const r=await fetch('/api/auth/status');const d=await r.json();if(d.autenticado)location.href=d.usuario?.admin?'/admin':'/';if(!d.configurado)location.href='/configurar';}catch(e){document.getElementById('e').textContent='Servidor indisponível.'}}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:u.value,senha:s.value,captchaId:document.getElementById('loginCaptchaId').value,captchaAnswer:document.getElementById('loginCaptchaAnswer').value})});const d=await r.json();if(r.ok)location.href=d.usuario?.admin?'/admin':'/';else document.getElementById('e').className='err',document.getElementById('e').textContent=d.msg||'Não foi possível entrar.';loadAuthCaptcha('login')};
function showMode(mode){['f','registerForm','rf','verifyForm'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=id===mode?'block':'none'});document.getElementById('showRegister').style.display=mode==='f'?'block':'none';document.getElementById('forgot').style.display=mode==='f'?'block':'none';document.getElementById('backToLogin').style.display=mode==='f'?'none':'block';const box=document.getElementById('e');box.textContent='';box.className='';document.querySelector('.box').scrollTop=0;}
document.getElementById('showRegister').onclick=()=>{showMode('registerForm');loadAuthCaptcha('register')};
document.getElementById('backToLogin').onclick=()=>{showMode('f');loadAuthCaptcha('login')}; 
document.getElementById('registerForm').onsubmit=async e=>{e.preventDefault();const box=document.getElementById('e');box.className='';box.textContent='';const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({usuario:document.getElementById('newUser').value,email:document.getElementById('newEmail').value,senha:document.getElementById('newPassword').value,acceptedRegulosPolicy:document.getElementById('acceptRegulosPolicy').checked,policyVersion:'1.0',captchaId:document.getElementById('registerCaptchaId').value,captchaAnswer:document.getElementById('registerCaptchaAnswer').value})});const d=await r.json().catch(()=>({}));if(r.ok&&d.ok){const registeredUser=document.getElementById('newUser').value;showMode('verifyForm');document.getElementById('verifyForm').reset();document.getElementById('verifyUser').value=registeredUser;box.className='';box.textContent=d.msg||'Confira seu e-mail e digite o código de 6 dígitos.'}else{box.className='err';box.textContent=d.msg||'Não foi possível criar a conta.';loadAuthCaptcha('register');if(String(d.msg||'').toLowerCase().includes('e-mail já está cadastrado'))box.textContent='Esse e-mail já está cadastrado. Volte para entrar usando seu e-mail ou use “Esqueci minha senha”.'}}; 
document.getElementById('forgot').onclick=()=>showMode('rf');
document.getElementById('sendRecovery').onclick=async()=>{const box=document.getElementById('e');box.className='';box.textContent='';const r=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('recoveryEmail').value})});const d=await r.json();box.className=r.ok?'':'err';box.textContent=d.msg||'Não foi possível solicitar a recuperação.'};
document.getElementById('rf').onsubmit=async e=>{e.preventDefault();const box=document.getElementById('e');box.textContent='';const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('recoveryEmail').value,codigo:document.getElementById('recoveryCode').value,novaSenha:document.getElementById('rs').value})});const d=await r.json();if(r.ok){box.className='';box.textContent=d.msg||'Senha redefinida.';document.getElementById('rf').reset()}else{box.className='err';box.textContent=d.msg||'Não foi possível recuperar a senha.'}};
document.getElementById('verifyForm').onsubmit=async e=>{e.preventDefault();const box=document.getElementById('e');box.className='';box.textContent='Confirmando e-mail...';try{const r=await fetch('/api/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('verifyUser').value,codigo:document.getElementById('verifyCode').value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.msg||'Não foi possível confirmar o e-mail.');box.className='';box.textContent=d.msg||'E-mail confirmado com sucesso.';document.getElementById('verifyCode').value='';setTimeout(()=>{showMode('f');document.getElementById('u').value=document.getElementById('verifyUser').value;box.className='';box.textContent='E-mail confirmado. Agora entre com sua senha.'},1800)}catch(err){box.className='err';box.textContent=err.message}};
document.getElementById('resendVerification').onclick=async()=>{const box=document.getElementById('e');box.className='';box.textContent='Solicitando novo código...';try{const r=await fetch('/api/auth/resend-verification',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:document.getElementById('verifyUser').value})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.msg||'Não foi possível reenviar o código.');box.textContent=d.msg;document.getElementById('verifyCode').value=''}catch(err){box.className='err';box.textContent=err.message}};loadAuthCaptcha('login');init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
      .then(() => console.log('RegulOS PWA: service worker ativo'))
      .catch(err => console.warn('RegulOS PWA: falha ao registrar service worker', err));
  });
}
</script>
</body>
</html>
