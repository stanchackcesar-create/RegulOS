<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RegulOS — Integrações</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080e1a;color:#eef3ff;font-family:Segoe UI,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px}.panel{background:#111b2d;border:1px solid #263653;border-radius:16px;padding:20px;margin-bottom:14px}
h1{margin:0 0 6px}.muted{color:#9eb0ca;font-size:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:#34445c;color:#fff}button.primary{background:#3d83f6}button.red{background:#ef4444}
.badge{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px}.ok{background:#125d34}.off{background:#64252a}.wait{background:#6b5411}
.card{border:1px solid #263653;border-radius:13px;padding:15px;background:#0b1423;margin-top:12px}.hidden{display:none!important}
.notice{padding:10px 12px;border-radius:10px;background:#19273e;margin-top:12px}.error{background:#481c27}.success{background:#123e29}
a{color:#7eb2ff}
@media(max-width:560px){.wrap{padding:12px}.panel{padding:14px}button{width:100%;min-height:44px}.row{align-items:stretch}}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <div><h1>🔌 Integrações</h1><div class="muted">Conecte as lojas ao RegulOS usando a autorização oficial.</div></div>
      <button onclick="location.href='/'">Voltar ao RegulOS</button>
    </div>
  </div>

  <div class="panel">
    <h2>🛍️ Shopee</h2>
    <div id="status" class="card">Carregando...</div>
    <div id="actions" class="row" style="margin-top:12px"></div>
    <div id="msg"></div>
  </div>

  <div class="panel">
    <h2>Como vai funcionar</h2>
    <div class="muted">
      O RegulOS não recebe sua senha da Shopee. Você entra na Shopee e autoriza o aplicativo.
      Depois disso, o RegulOS usa a API oficial para consultar os produtos da loja autorizada.
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
function msg(text,type='notice'){ $('msg').innerHTML='<div class="'+type+'">'+text+'</div>'; }
async function load(){
  const r=await fetch('/api/integracoes/shopee/status');
  if(!r.ok){msg('Não foi possível consultar a integração.','error');return;}
  const d=await r.json();
  const configured=d.configured&&d.encryptionConfigured;
  if(d.connected){
    $('status').innerHTML='<span class="badge ok">CONECTADA</span><div style="margin-top:10px">Loja autorizada: <b>'+((d.shopIds||[]).join(', ')||'não informado')+'</b></div><div class="muted" style="margin-top:5px">Conectada em '+new Date(d.connectedAt).toLocaleString('pt-BR')+'</div>';
    $('actions').innerHTML='<button class="red" onclick="disconnect()">Desconectar Shopee</button>';
  }else if(!configured){
    $('status').innerHTML='<span class="badge wait">CONFIGURAÇÃO PENDENTE</span><div class="muted" style="margin-top:10px">Faltam as variáveis da aplicação Shopee no Railway.</div>';
    $('actions').innerHTML='';
  }else{
    $('status').innerHTML='<span class="badge off">NÃO CONECTADA</span><div class="muted" style="margin-top:10px">Nenhuma loja Shopee foi autorizada ainda.</div>';
    $('actions').innerHTML='<button class="primary" onclick="connect()">🛍️ Conectar minha Shopee</button>';
  }
}
async function connect(){
  msg('Abrindo autorização oficial da Shopee...');
  const r=await fetch('/api/integracoes/shopee/authorize');
  const d=await r.json();
  if(!r.ok||!d.url){msg(d.msg||'Não foi possível iniciar a autorização.','error');return;}
  location.href=d.url;
}
async function disconnect(){
  if(!confirm('Desconectar a Shopee do RegulOS?'))return;
  const r=await fetch('/api/integracoes/shopee/disconnect',{method:'POST'});
  const d=await r.json();
  msg(d.msg||'Conexão removida.',r.ok?'success':'error');
  load();
}
load();
</script>
</body>
</html>
